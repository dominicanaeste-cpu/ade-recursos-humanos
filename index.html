<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADE Vacaciones - Asociación Dominicana del Este</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body id="app-body">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" style="padding: 32px 24px; text-align: center;">
            <div style="background: white; border-radius: 50%; width: 80px; height: 80px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--secondary); box-shadow: var(--shadow);">
                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIVgdcfc-pSyeoPqozZsAQohqMISwXCblQi7tgqgT6URh6g_V4iOEBYU9nJTpk748L73UazMerEXnOk2XSMJz0a5wY9muXKdcHhqVzNVUefF_WQBAq7kdCijAXm317jd_yr_59GlFhREY2HwE6_c7q-v5kaUNmrD7Emt3kl9Sk6u6vrEI4oZ3I9oCKZZivpaDvxnrszKqIFx8ZEhzrg_1DNqfuN6OIUKrwKW7WJzTZQ1UVJ9KQYIAuelp_E7wCD7qWv25hpaRqOhs" alt="ADE" style="width: 50px; height: 50px; object-contain: contain;">
            </div>
            <h2 style="font-size: 0.8rem; font-weight: 800; color: var(--primary); letter-spacing: 0.05em; text-transform: uppercase;">A. D. DEL ESTE</h2>
            <p style="font-size: 0.7rem; color: var(--text-muted); font-weight: 600;">Gestión de Vacaciones</p>
        </div>
        
        <nav style="flex: 1;">
            <a href="#" class="nav-link active" onclick="app.navigate('dashboard', event)">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-link" onclick="app.navigate('manager', event)" id="nav-manager">
                <span class="material-symbols-outlined">group</span>
                <span>Manager Panel</span>
            </a>
            <a href="#" class="nav-link" onclick="app.navigate('hr', event)" id="nav-hr">
                <span class="material-symbols-outlined">badge</span>
                <span>Recursos Humanos</span>
            </a>
            <a href="#" class="nav-link" onclick="app.navigate('assistant', event)" id="nav-assistant">
                <span class="material-symbols-outlined">admin_panel_settings</span>
                <span>Asistente RRHH</span>
            </a>
            <a href="#" class="nav-link" onclick="app.navigate('form', event)">
                <span class="material-symbols-outlined">description</span>
                <span>Nueva Solicitud</span>
            </a>
        </nav>
        
        <div style="padding: 24px; border-top: 1px solid #f1f5f9;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary);">JP</div>
                <div style="flex: 1;">
                    <p style="font-size: 0.8rem; font-weight: 700; margin-bottom: 2px;">Juan Pérez</p>
                    <p style="font-size: 0.7rem; color: var(--text-muted);">Pastor • 8 Años</p>
                </div>
            </div>
            
            <div style="padding: 12px; border-radius: 12px; background: #f8fafc; font-size: 0.75rem; border: 1px dashed #e2e8f0;">
                <p style="color: var(--text-muted); margin-bottom: 4px;">Rol actual:</p>
                <select id="role-selector" style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 600; color: var(--primary);" onchange="app.switchRole(this.value)">
                    <option value="employee">Empleado</option>
                    <option value="manager">Manager</option>
                    <option value="hr">RRHH</option>
                    <option value="assistant">Asistente RRHH</option>
                </select>
            </div>
        </div>
    </aside>

    <!-- Content Area -->
    <main class="main-content" id="main-content">
        <div id="view-container">
            <!-- Dynamic content will be injected here -->
            <div style="height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-direction: column;">
                <div class="spinner"></div>
                <p style="margin-top: 16px; font-weight: 600;">Cargando Dashboard Ministerial...</p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/state.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
